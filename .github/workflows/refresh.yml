name: Dashboard refresh

on:
  schedule:
    # Every six hours. Prices settle around 01:30 UTC and injury news lands
    # through the day, so a weekly rebuild was always showing stale news.
    # Cron here is always UTC, never local time.
    - cron: "0 */6 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the dashboard from live FPL data
        run: python update.py

      - name: Commit and publish if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated timestamp always changes, so compare the substance.
          if git diff --quiet -- history; then
            if ! git diff -- index.html | grep -qE '^[+-].*(pname|hc |drow|call|kpi)'; then
              echo "Projections unchanged - nothing worth publishing."
              git checkout -- dashboard.html index.html 2>/dev/null || true
              exit 0
            fi
          fi
          git add dashboard.html index.html history
          git commit -m "Dashboard refresh $(date -u '+%Y-%m-%d')"
          git push
          echo "Published. Pages will rebuild shortly."
